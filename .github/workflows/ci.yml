name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Klinova.slnx
          dotnet tool restore

      - name: Check formatting
        run: dotnet format Klinova.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build Klinova.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Check that the EF Core model has no pending migrations
        run: |
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
            -p src/Klinova.Infrastructure -s src/Klinova.Infrastructure --context SqliteAppDbContext
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
            -p src/Klinova.Infrastructure -s src/Klinova.Infrastructure --context SqlServerAppDbContext

      - name: Test
        run: >
          dotnet test Klinova.slnx --no-build --configuration Release
          --logger "trx;LogFilePrefix=results"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: klinova:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name klinova -p 8080:8080 klinova:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs klinova
          exit 1
