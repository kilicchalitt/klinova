# Klinova — single-server deployment with SQLite.
#
#   cp .env.example .env      # optional: set the initial administrator password
#   docker compose up -d
#
# The application listens on http://localhost:8080. Put a TLS-terminating reverse
# proxy (nginx, Caddy, Traefik, IIS ARR…) in front of it for production use.
name: klinova

services:
  klinova:
    build: .
    image: klinova:latest
    restart: unless-stopped
    ports:
      - "${KLINOVA_PORT:-8080}:8080"
    environment:
      Klinova__Seed__AdminUserName: ${KLINOVA_ADMIN_USER:-admin}
      Klinova__Seed__AdminPassword: ${KLINOVA_ADMIN_PASSWORD:-}
      Klinova__Seed__DemoData: ${KLINOVA_DEMO_DATA:-false}
      Klinova__TimeZone: ${KLINOVA_TIMEZONE:-Europe/Istanbul}
    volumes:
      - klinova-data:/app/data

volumes:
  klinova-data:
